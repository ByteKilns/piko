<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;244px&quot;,&quot;height&quot;:&quot;760px&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;expenses&quot;,&quot;budget&quot;,&quot;recurring&quot;,&quot;savings&quot;,&quot;dhuku&quot;,&quot;reports&quot;],&quot;default&quot;:&quot;expenses&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onAdd&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
const KEYS = ['home', 'expenses', 'budget', 'recurring', 'savings', 'loans', 'dhuku', 'reports'];
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active || 'expenses';
    const n = {};
    KEYS.forEach(k => {
      const on = k === a;
      n[k] = { on, cur: on ? 'page' : undefined, fw: on ? 600 : 400, color: on ? 'var(--color-text)' : 'var(--color-neutral-800)', bg: on ? 'var(--color-surface)' : 'transparent' };
    });
    return {
      n,
      onAdd: () => { if (this.props.onAdd) this.props.onAdd(); else window.location.href = 'Expenses.dc.html#add'; }
    };
  }
}
</script>
